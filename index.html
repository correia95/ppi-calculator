    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "FAQPage",
        "mainEntity": [
          {
            "@type": "Question",
            "name": "How do you calculate PPI?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "Take the square root of (horizontal pixels squared plus vertical pixels squared) to get the diagonal in pixels, then divide by the screen's diagonal in inches."
            }
          },
          {
            "@type": "Question",
            "name": "What is the difference between PPI and DPI?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "PPI (pixels per inch) describes a screen's pixel density. DPI (dots per inch) is the same measure for a printer or a printed image. In everyday use the two terms are interchangeable."
            }
          },
          {
            "@type": "Question",
            "name": "What DPI should I print a photo at?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "About 300 DPI for prints you hold in your hand. Divide the image's pixel dimensions by 300 to find the largest size it prints well. Posters viewed from a distance are fine at 150 DPI or lower."
            }
          },
          {
            "@type": "Question",
            "name": "What counts as a Retina display?",
            "acceptedAnswer": {
              "@type": "Answer",
              "text": "A density high enough that at a normal viewing distance the eye cannot resolve individual pixels — roughly 220 PPI for a laptop at 50 cm or 300 or more PPI for a phone at 30 cm."
            }
          }
        ]
      }
    </script>
